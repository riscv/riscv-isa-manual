---
# yaml-language-server: $schema=../docs-resources/schemas/defs-schema.json

$schema: "../docs-resources/schemas/defs-schema.json#"

chapter_name: Vector Extension for Reordering Structured Data

normative_rule_definitions:
  - name: Zvzip_dependent_Zve32x
    tags: ["norm:Zvzip_dependent_Zve32x"]

  - name: Zvzip_eew
    tags: ["norm:Zvzip_eew"]

  - name: Zvzip_diel
    tags: ["norm:Zvzip_diel"]
    summary: All Zvzip instructions must have data-independent execution latency when Zvkt is implemented.

  - name: Zvzip_operand_emul
    tags: ["norm:Zvzip_operand_emul"]
    summary: vtype/vl describe the destination (EMUL=LMUL, vl elements); sources have EMUL=LMUL/2 (vzip), 2*LMUL (unzips), or LMUL (pairs).

  - name: Zvzip_operand_align
    tags: ["norm:Zvzip_operand_align"]

  - name: Zvzip_elem_handling
    tags: ["norm:Zvzip_elem_handling"]

  - name: vzip-vv_op
    tags: ["norm:vzip-vv_op"]

  - name: vzip-vv_emul_constr
    tags: ["norm:vzip-vv_emul_constr"]
    summary: vzip.vv raises an illegal-instruction exception when 2*SEW > LMUL*ELEN.

  - name: vzip-vv_vreg_constr
    tags: ["norm:vzip-vv_vreg_constr"]
    summary: A vzip.vv source may overlap the destination only as its highest-numbered half; other overlaps raise an illegal-instruction exception.

  - name: vunzipe-v_op
    tags: ["norm:vunzipe-v_op"]

  - name: vunzipo-v_op
    tags: ["norm:vunzipo-v_op"]

  - name: vunzip_src_read
    tags: ["norm:vunzip_src_read"]
    summary: The unzip instructions read the source at indices below 2*vl.

  - name: vunzip_lmul_constr
    tags: ["norm:vunzip_lmul_constr"]
    summary: The unzip instructions raise an illegal-instruction exception when LMUL=8.

  - name: vunzip_vreg_constr
    tags: ["norm:vunzip_vreg_constr"]
    summary: The unzip destination may overlap the source only if vd equals vs2; other overlaps raise an illegal-instruction exception.

  - name: vpaire-vv_op
    tags: ["norm:vpaire-vv_op"]

  - name: vpairo-vv_op
    tags: ["norm:vpairo-vv_op"]

  - name: vpairo-vv_oddvl_op
    tags: ["norm:vpairo-vv_oddvl_op"]
    summary: If vl is odd, the vpairo.vv result for element vl-1 is 0 and vs2[vl] is not read.

  - name: vpair_vreg_constr
    tags: ["norm:vpair_vreg_constr"]
    summary: The vpaire.vv/vpairo.vv destination cannot overlap either source; an overlapping encoding raises an illegal-instruction exception.
