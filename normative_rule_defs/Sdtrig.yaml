    tags: ["norm:Sdtrig_textra32_sselect_ignore"]

  - name: Sdtrig_textra32_sselect_scontext
    summary: "Matches only if low scontext bits equal svalue."
    tags: ["norm:Sdtrig_textra32_sselect_scontext"]

  - name: Sdtrig_textra32_sselect_asid
    summary: "The sselect ASID option matches when the current mode's ASID (vsatp in VS/VU-mode, else satp) equals svalue's ASIDMAX bits."
    tags: ["norm:Sdtrig_textra32_sselect_asid1", "norm:Sdtrig_textra32_sselect_asid2", "norm:Sdtrig_textra32_sselect_asid3"]

  - name: Sdtrig_textra32_sselect_no_s
    summary: "sselect should be tied to 0 when S-mode is unsupported."
    tags: ["norm:Sdtrig_textra32_sselect_no_s"]

  - name: Sdtrig_textra64
    summary: "textra64 provides access to the trigger selected by tselect."
    tags: ["norm:Sdtrig_textra64"]

  - name: Sdtrig_textra64_reset
    summary: "textra64 reset values apply to every underlying trigger."
    tags: ["norm:Sdtrig_textra64_reset"]

  - name: Sdtrig_textra64_access
    summary: "textra64 accessible as tdata3 for types 2-6 when XLEN=64."
    tags: ["norm:Sdtrig_textra64_access"]

  - name: Sdtrig_textra64_retain
    summary: "textra64 retains its value when XLEN changes."
    tags: ["norm:Sdtrig_textra64_retain"]

  - name: Sdtrig_textra64_xlen32
    summary: "At XLEN=32, some textra64 bits are accessed through textra32."
    tags: ["norm:Sdtrig_textra64_xlen32"]

  - name: Sdtrig_textra64_byte_granular
    summary: "Byte-granular scontext/svalue comparison allows multiple comparison elements."
    tags: ["norm:Sdtrig_textra64_byte_granular"]

  - name: Sdtrig_textra64_byte_mask_applies
    summary: "Byte masking applies only to scontext comparison, when sselect=1."
    tags: ["norm:Sdtrig_textra64_byte_mask_applies"]

  - name: Sdtrig_textra64_sbytemask
    summary: "sbytemask bits ignore corresponding scontext comparison bytes when sselect=1."
    tags: ["norm:Sdtrig_textra64_sbytemask"]
