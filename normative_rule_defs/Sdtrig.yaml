---
# yaml-language-server: $schema=../docs-resources/schemas/defs-schema.json

$schema: "../docs-resources/schemas/defs-schema.json#"

# Normative rule definitions for the Sdtrig (Trigger Module) extension.
# Tags refer to norm: anchors in debugandtrace/Sdtrig.adoc and
# debugandtrace/registers/hwbp_registers.adoc.
chapter_name: Sdtrig

normative_rule_definitions:
  - name: Sdtrig_num_trigs_ge1
    summary: "Trigger Module must support at least one trigger if implemented."
    tags: ["norm:Sdtrig_num_trigs_ge1"]

  - name: Sdtrig_unimp_csr_illegal
    summary: "Accessing trigger CSRs used by no trigger raises illegal instruction."
    tags: ["norm:Sdtrig_unimp_csr_illegal"]

  - name: Sdtrig_csr_mode
    summary: "M-Mode and Debug Mode accesses to used trigger CSRs must succeed."
    tags: ["norm:Sdtrig_csr_mode"]

  - name: Sdtrig_no_debug_fires
    summary: "Triggers do not fire while in Debug Mode."
    tags: ["norm:Sdtrig_no_debug_fires"]

  - name: Sdtrig_actions
    summary: "Triggers can be configured to take one of several actions when firing."
    tags: ["norm:Sdtrig_actions"]

  - name: Sdtrig_action0
    summary: "Action 0 raises a breakpoint exception; xepc holds next instruction address."
    tags: ["norm:Sdtrig_action0"]

  - name: Sdtrig_action1
    summary: "Action 1 enters Debug Mode; requires dmode=1 and Sdext support."
    tags: ["norm:Sdtrig_action1"]

  - name: Sdtrig_action2
    summary: "Action 2 turns trace on, per the trace specification."
    tags: ["norm:Sdtrig_action2"]

  - name: Sdtrig_action3
    summary: "Action 3 turns trace off, per the trace specification."
    tags: ["norm:Sdtrig_action3"]

  - name: Sdtrig_action4
    summary: "Action 4 sends trace notify, per the trace specification."
    tags: ["norm:Sdtrig_action4"]

  - name: Sdtrig_action5_rsv
    summary: "Action 5 is reserved for use by the trace specification."
    tags: ["norm:Sdtrig_action5_rsv"]

  - name: Sdtrig_action8_9
    summary: "Actions 8-9 signal TM external trigger output 0 or 1."
    tags: ["norm:Sdtrig_action8_9"]

  - name: Sdtrig_action_rsv
    summary: "Other action values are reserved for future use."
    tags: ["norm:Sdtrig_action_rsv"]

  - name: Sdtrig_priority
    summary: "Priority table groups equal priorities; Privileged Spec wins on conflict."
    tags: ["norm:Sdtrig_priority"]

  - name: Sdtrig_non_precise_priority
    summary: "Priority table applies only to precise triggers, else priority is irrelevant."
    tags: ["norm:Sdtrig_non_precise_priority"]

  - name: Sdtrig_chain_priority
    summary: "Chained triggers take the lowest priority among triggers in the chain."
    tags: ["norm:Sdtrig_chain_priority"]

  - name: Sdtrig_multiple_fires
    summary: "Simultaneous same-priority fires set hit (if implemented) for all of them."
    tags: ["norm:Sdtrig_multiple_fires"]

  - name: Sdtrig_tval
    summary: "With multiple action-0 triggers, which one updates tval is UNSPECIFIED."
    tags: ["norm:Sdtrig_tval"]

  - name: Sdtrig_debug_breakpoint
    summary: "Preferred: run both debug and breakpoint actions, order implementation-dependent."
    tags: ["norm:Sdtrig_debug_breakpoint"]

  - name: Sdtrig_simul_debug_breakpoint_fallback
    summary: "If unsupported, hart enters Debug Mode and ignores the breakpoint exception."
    tags: ["norm:Sdtrig_simul_debug_breakpoint_fallback"]

  - name: Sdtrig_hit_set_on_action0
    summary: "The action-0 trigger's hit bit must still be set for debuggers."
    tags: ["norm:Sdtrig_hit_set_on_action0"]

  - name: Sdtrig_independent_trigs
    summary: "Triggers with action other than 0 or 1 fire independently."
    tags: ["norm:Sdtrig_independent_trigs"]

  - name: Sdtrig_breakpoint_delegated
    summary: "Breakpoint exception may be taken in M-mode or delegated lower."
    tags: ["norm:Sdtrig_breakpoint_delegated"]

  - name: Sdtrig_Aext_lr_op
    summary: "lr instructions are treated as loads."
    tags: ["norm:Sdtrig_Aext_lr_op"]

  - name: Sdtrig_Aext_sc_op
    summary: "Successful sc instructions are treated as stores."
    tags: ["norm:Sdtrig_Aext_sc_op"]

  - name: Sdtrig_Aext_sc_fail
    summary: "Whether failing sc instructions count as stores is UNSPECIFIED."
    tags: ["norm:Sdtrig_Aext_sc_fail"]

  - name: Sdtrig_AMO_read
    summary: "Each AMO is a load for the read portion of the operation."
    tags: ["norm:Sdtrig_AMO_read"]

  - name: Sdtrig_AMO_read_addr
    summary: "The AMO read address is always available to trigger on."
    tags: ["norm:Sdtrig_AMO_read_addr"]

  - name: Sdtrig_AMO_store
    summary: "Each AMO is a store for the write portion of the operation."
    tags: ["norm:Sdtrig_AMO_store"]

  - name: Sdtrig_AMO_store_addr
    summary: "The AMO store address is always available to trigger on."
    tags: ["norm:Sdtrig_AMO_store_addr"]

  - name: Sdtrig_AMO_store_match
    summary: "Whether data store triggers match on AMOs is UNSPECIFIED."
    tags: ["norm:Sdtrig_AMO_store_match"]

  - name: Sdtrig_load_zero_rd
    summary: "Load/AMO to zero: whether a data load trigger matches is UNSPECIFIED."
    tags: ["norm:Sdtrig_load_zero_rd"]

  - name: Sdtrig_mult_mem_access
    summary: "Multi-access instructions should match as if each access happened individually."
    tags: ["norm:Sdtrig_mult_mem_access"]

  - name: Sdtrig_caches_stores
    summary: "Two classes of cache operations must match as stores."
    tags: ["norm:Sdtrig_caches_stores_1", "norm:Sdtrig_caches_stores_2", "norm:Sdtrig_caches_stores_3"]

  - name: Sdtrig_cache_compare
    summary: "Only size=0, select=0 triggers match; the compare value is one of three address options, most-to-least desirable."
    tags: ["norm:Sdtrig_cache_compare", "norm:Sdtrig_cache_compare_opts"]

  - name: Sdtrig_cache_hints
    summary: "Cache operations encoded as HINTs do not match debug triggers."
    tags: ["norm:Sdtrig_cache_hints"]

  - name: Sdtrig_cache_clears
    summary: "cbo.clean, cbo.flush, and cbo.inval match as stores affecting consistency."
    tags: ["norm:Sdtrig_cache_clears"]

  - name: Sdtrig_cbo_zero
    summary: "cbo.zero matches as a store because it block-writes constant data."
    tags: ["norm:Sdtrig_cbo_zero"]

  - name: Sdtrig_prefetch
    summary: "Prefetch instructions do not match triggers at all."
    tags: ["norm:Sdtrig_prefetch"]

  - name: Sdtrig_tdata2_addr_sz1
    summary: "For unmasked address matches, tdata2 must hold all valid addresses exactly."
    tags: ["norm:Sdtrig_tdata2_addr_sz1"]

  - name: Sdtrig_pmem
    summary: "Physical addresses narrower than XLEN are zero-extended."
    tags: ["norm:Sdtrig_pmem"]

  - name: Sdtrig_vmem
    summary: "Virtual addresses narrower than XLEN are sign-extended."
    tags: ["norm:Sdtrig_vmem"]

  - name: Sdtrig_csr_tdata2_sz2
    summary: "tdata2 must store enough bits for all supported address values."
    tags: ["norm:Sdtrig_csr_tdata2_sz2"]

  - name: Sdtrig_csr_tdata2_invalid
    summary: "Unrepresentable invalid addresses should convert to representable invalid ones."
    tags: ["norm:Sdtrig_csr_tdata2_invalid"]

  - name: Sdtrig_multistate_change
    summary: "Multi-state-change instructions may trigger mid-execution; definition specifies state-change order."
    tags: ["norm:Sdtrig_multistate_change"]

  - name: Sdtrig_tdata_warl
    summary: "All tdata registers follow write-any-read-legal (WARL) semantics."
    tags: ["norm:Sdtrig_tdata_warl"]

  - name: Sdtrig_tdata_write
    summary: "Writing one tdata register must not modify others or unselected triggers."
    tags: ["norm:Sdtrig_tdata_write"]

  - name: Sdtrig_disable_trig
    summary: "Writing 0 to tdata1 disables trigger and frees tdata2/tdata3 writes."
    tags: ["norm:Sdtrig_disable_trig"]

  - name: Sdtrig_unimplemented_register
    summary: "Accessing an unimplemented Trigger Module Register raises illegal instruction exception."
    tags: ["norm:Sdtrig_unimplemented_register"]

  - name: Sdtrig_trigger_modes
    summary: "Trigger registers (except context CSRs) accessible only in machine/Debug Mode."
    tags: ["norm:Sdtrig_trigger_modes"]

  - name: Sdtrig_xlen_handling
    summary: "Per-mode XLEN differences are handled as described."
    tags: ["norm:Sdtrig_xlen_handling"]

  - name: Sdtrig_fields
    summary: "Fields retain values regardless of XLEN, which only affects their position."
    tags: ["norm:Sdtrig_fields"]

  - name: Sdtrig_fields_high
    summary: "Some fields wider at XLEN=64; high bits unreadable at XLEN=32."
    tags: ["norm:Sdtrig_fields_high"]

  - name: Sdtrig_xlen_modification
    summary: "Modifying a register at XLEN=32 clears its inaccessible bits."
    tags: ["norm:Sdtrig_xlen_modification"]

  - name: Sdtrig_tselect
    summary: "tselect determines which trigger the other Trigger Module registers access."
    tags: ["norm:Sdtrig_tselect"]

  - name: Sdtrig_tselect_access
    summary: "The set of accessible triggers must start at 0 and be contiguous."
    tags: ["norm:Sdtrig_tselect_access"]

  - name: Sdtrig_tselect_warl
    summary: "The tselect register is WARL."
    tags: ["norm:Sdtrig_tselect_warl"]

  - name: Sdtrig_tdata1
    summary: "tdata1 provides access to the trigger selected by tselect."
    tags: ["norm:Sdtrig_tdata1"]

  - name: Sdtrig_tdata1_reset
    summary: "tdata1 reset values apply to every underlying trigger."
    tags: ["norm:Sdtrig_tdata1_reset"]

  - name: Sdtrig_tdata1_write0
    summary: "Writing 0 to tdata1 must result in a disabled trigger."
    tags: ["norm:Sdtrig_tdata1_write0"]

  - name: Sdtrig_tdata1_multiple_types
    summary: "For multi-type triggers, hardware disables by setting type to 15."
    tags: ["norm:Sdtrig_tdata1_multiple_types"]

  - name: Sdtrig_tdata1_type_disabled
    summary: "type=15 disables trigger; tdata2/tdata3 accept any supported value."
    tags: ["norm:Sdtrig_tdata1_type_disabled"]

  - name: Sdtrig_tdata1_type_rsv
    summary: "Other tdata1 type values are reserved for future use."
    tags: ["norm:Sdtrig_tdata1_type_rsv"]

  - name: Sdtrig_tdata1_dmode_type_0
    summary: "When type is 0, the dmode bit is hard-wired to 0."
    tags: ["norm:Sdtrig_tdata1_dmode_type_0"]

  - name: Sdtrig_tdata1_dmode_0
    summary: "dmode=0 lets both Debug and M-mode write tdata registers."
    tags: ["norm:Sdtrig_tdata1_dmode_0"]

  - name: Sdtrig_tdata1_dmode_1
    summary: "dmode=1 lets only Debug Mode write tdata; other writes ignored."
    tags: ["norm:Sdtrig_tdata1_dmode_1"]

  - name: Sdtrig_tdata1_dmode_writable
    summary: "The dmode bit is only writable from Debug Mode."
    tags: ["norm:Sdtrig_tdata1_dmode_writable"]

  - name: Sdtrig_tdata1_data
    summary: "When type is 0, the data field is hard-wired to 0."
    tags: ["norm:Sdtrig_tdata1_data"]

  - name: Sdtrig_tdata2
    summary: "tdata2 provides access to the trigger selected by tselect."
    tags: ["norm:Sdtrig_tdata2"]

  - name: Sdtrig_tdata2_reset
    summary: "tdata2 reset values apply to every underlying trigger."
    tags: ["norm:Sdtrig_tdata2_reset"]

  - name: Sdtrig_tdata2_disabled
    summary: "When trigger disabled, tdata2 accepts any value supported by its types."
    tags: ["norm:Sdtrig_tdata2_disabled"]

  - name: Sdtrig_tdata2_sign_extend
    summary: "When XLEN is below DXLEN, writes to tdata2 are sign-extended."
    tags: ["norm:Sdtrig_tdata2_sign_extend"]

  - name: Sdtrig_tdata3
    summary: "tdata3 provides access to the trigger selected by tselect."
    tags: ["norm:Sdtrig_tdata3"]

  - name: Sdtrig_tdata3_reset
    summary: "tdata3 reset values apply to every underlying trigger."
    tags: ["norm:Sdtrig_tdata3_reset"]

  - name: Sdtrig_tdata3_disabled
    summary: "When trigger disabled, tdata3 accepts any value supported by its types."
    tags: ["norm:Sdtrig_tdata3_disabled"]

  - name: Sdtrig_tdata3_sign_extend
    summary: "When XLEN is below DXLEN, writes to tdata3 are sign-extended."
    tags: ["norm:Sdtrig_tdata3_sign_extend"]

  - name: Sdtrig_tinfo
    summary: "tinfo provides access to the trigger selected by tselect."
    tags: ["norm:Sdtrig_tinfo"]

  - name: Sdtrig_tinfo_reset
    summary: "tinfo reset values apply to every underlying trigger."
    tags: ["norm:Sdtrig_tinfo_reset"]

  - name: Sdtrig_tinfo_optional
    summary: "tinfo optional when no triggers, or type fixed and version 0."
    tags: ["norm:Sdtrig_tinfo_optional"]

  - name: Sdtrig_tinfo_version
    summary: "The version field contains the implemented Sdtrig extension version."
    tags: ["norm:Sdtrig_tinfo_version"]

  - name: Sdtrig_tinfo_version_0
    summary: "version 0 supports triggers per commit 5a5c078, February 2023."
    tags: ["norm:Sdtrig_tinfo_version_0"]

  - name: Sdtrig_tinfo_version_1
    summary: "version 1 supports triggers per ratified 1.0 of this document."
    tags: ["norm:Sdtrig_tinfo_version_1"]

  - name: Sdtrig_tinfo_support
    summary: "One bit per type; a set bit means that type supported."
    tags: ["norm:Sdtrig_tinfo_support"]

  - name: Sdtrig_tinfo_no_trigger
    summary: "If the selected trigger doesn't exist, this field contains 1."
    tags: ["norm:Sdtrig_tinfo_no_trigger"]

  - name: Sdtrig_trigger_modes_1
    summary: "Optional tcontrol register, M/Debug only, provides trigger control bits."
    tags: ["norm:Sdtrig_trigger_modes_1"]

  - name: Sdtrig_tcontrol_mpte
    summary: "On any M-mode trap, mpte is set to mte's value."
    tags: ["norm:Sdtrig_tcontrol_mpte"]

  - name: Sdtrig_tcontrol_mte_disabled
    summary: "mte=0: action-0 triggers do not match/fire in M-mode."
    tags: ["norm:Sdtrig_tcontrol_mte_disabled"]

  - name: Sdtrig_tcontrol_mte_enabled
    summary: "mte=1: triggers do match/fire while the hart is in M-mode."
    tags: ["norm:Sdtrig_tcontrol_mte_enabled"]

  - name: Sdtrig_tcontrol_mte
    summary: "On any M-mode trap, mte is set to 0."
    tags: ["norm:Sdtrig_tcontrol_mte"]

  - name: Sdtrig_tcontrol_mte_mret
    summary: "On mret, mte is restored to mpte's value."
    tags: ["norm:Sdtrig_tcontrol_mte_mret"]

  - name: Sdtrig_hcontext_implemented
    summary: "hcontext optional, only with H extension; requires mcontext implemented."
    tags: ["norm:Sdtrig_hcontext_implemented"]

  - name: Sdtrig_hcontext_access
    summary: "hcontext only accessible in HS-Mode, M-mode, and Debug Mode."
    tags: ["norm:Sdtrig_hcontext_access"]

  - name: Sdtrig_hcontext_smstateen
    summary: "With Smstateen, HS-Mode accessibility controlled by mstateen0[57]."
    tags: ["norm:Sdtrig_hcontext_smstateen"]

  - name: Sdtrig_hcontext
    summary: "hcontext aliases mcontext, exposing the hcontext field from HS-Mode."
    tags: ["norm:Sdtrig_hcontext"]

  - name: Sdtrig_scontext_access
    summary: "Optional scontext accessible in S/HS, VS, M-mode, and Debug Mode."
    tags: ["norm:Sdtrig_scontext_access"]

  - name: Sdtrig_scontext_accessibility
    summary: "scontext accessibility controlled by mstateen0[57] and hstateen0[57]."
    tags: ["norm:Sdtrig_scontext_accessibility"]

  - name: Sdtrig_scontext_data
    summary: "Supervisor software writes a context number to set context-specific triggers."
    tags: ["norm:Sdtrig_scontext_data"]

  - name: Sdtrig_mcontext_implementation
    summary: "mcontext required if hcontext implemented, otherwise optional."
    tags: ["norm:Sdtrig_mcontext_implementation"]

  - name: Sdtrig_mcontext_access
    summary: "mcontext is only accessible in M-mode and Debug Mode."
    tags: ["norm:Sdtrig_mcontext_access"]

  - name: Sdtrig_mcontext_hcontext_data
    summary: "M/HS-Mode software writes a context number for context-specific triggers."
    tags: ["norm:Sdtrig_mcontext_hcontext_data"]

  - name: Sdtrig_mscontext
    summary: "The optional mscontext register is an alias for scontext."
    tags: ["norm:Sdtrig_mscontext"]

  - name: Sdtrig_mscontext_access
    summary: "mscontext accessible in S/HS-mode, M-mode, and Debug Mode."
    tags: ["norm:Sdtrig_mscontext_access"]

  - name: Sdtrig_mcontrol
    summary: "mcontrol provides access to the trigger selected by tselect."
    tags: ["norm:Sdtrig_mcontrol"]

  - name: Sdtrig_mcontrol_reset
    summary: "mcontrol reset values apply to every underlying trigger."
    tags: ["norm:Sdtrig_mcontrol_reset"]

  - name: Sdtrig_mcontrol_access
    summary: "mcontrol is accessible as tdata1 when type is 2."
    tags: ["norm:Sdtrig_mcontrol_access"]

  - name: Sdtrig_mcontrol_maskmax
    summary: "maskmax gives the largest NAPOT range (log2 bytes) for match=1."
    tags: ["norm:Sdtrig_mcontrol_maskmax"]

  - name: Sdtrig_mcontrol_sizehi
    summary: "sizehi (XLEN≥64) holds the two high access-size bits."
    tags: ["norm:Sdtrig_mcontrol_sizehi"]

  - name: Sdtrig_mcontrol_hit
    summary: "hit set when trigger fires; user-writable; identifies which triggers matched."
    tags: ["norm:Sdtrig_mcontrol_hit"]

  - name: Sdtrig_mcontrol_select_address
    summary: "select=0: compare value holds the access's lowest virtual address."
    tags: ["norm:Sdtrig_mcontrol_select_address"]

  - name: Sdtrig_mcontrol_select_data
    summary: "select=1: compare value holds the loaded/stored data or instruction."
    tags: ["norm:Sdtrig_mcontrol_select_data"]

  - name: Sdtrig_mcontrol_timing_before
    summary: "timing=0: action taken just before the matching instruction retires."
    tags: ["norm:Sdtrig_mcontrol_timing_before"]

  - name: Sdtrig_mcontrol_timing_multi
    summary: "For multi-access matching instructions, which accesses completed first is UNSPECIFIED."
    tags: ["norm:Sdtrig_mcontrol_timing_multi"]

  - name: Sdtrig_mcontrol_timing_after
    summary: "timing=1: action taken after the matching instruction retires."
    tags: ["norm:Sdtrig_mcontrol_timing_after"]

  - name: Sdtrig_mcontrol_timing_overlap
    summary: "Whether a timing-0 match prevents a timing-1 match is implementation-dependent."
    tags: ["norm:Sdtrig_mcontrol_timing_overlap"]

  - name: Sdtrig_mcontrol_size_any
    summary: "size=0: match any access size; well-defined if select=0 or XLEN."
    tags: ["norm:Sdtrig_mcontrol_size_any"]

  - name: Sdtrig_mcontrol_size_8bit
    summary: "size selects matching only 8-bit memory accesses."
    tags: ["norm:Sdtrig_mcontrol_size_8bit"]

  - name: Sdtrig_mcontrol_size_16bit
    summary: "size matches 16-bit memory accesses or 16-bit instruction execution."
    tags: ["norm:Sdtrig_mcontrol_size_16bit"]

  - name: Sdtrig_mcontrol_size_32bit
    summary: "size matches 32-bit memory accesses or 32-bit instruction execution."
    tags: ["norm:Sdtrig_mcontrol_size_32bit"]

  - name: Sdtrig_mcontrol_size_48bit
    summary: "size matches execution of 48-bit instructions."
    tags: ["norm:Sdtrig_mcontrol_size_48bit"]

  - name: Sdtrig_mcontrol_size_64bit
    summary: "size matches 64-bit memory accesses or 64-bit instruction execution."
    tags: ["norm:Sdtrig_mcontrol_size_64bit"]

  - name: Sdtrig_mcontrol_size_80bit
    summary: "size matches execution of 80-bit instructions."
    tags: ["norm:Sdtrig_mcontrol_size_80bit"]

  - name: Sdtrig_mcontrol_size_96bit
    summary: "size matches execution of 96-bit instructions."
    tags: ["norm:Sdtrig_mcontrol_size_96bit"]

  - name: Sdtrig_mcontrol_size_112bit
    summary: "size matches execution of 112-bit instructions."
    tags: ["norm:Sdtrig_mcontrol_size_112bit"]

  - name: Sdtrig_mcontrol_size_128bit
    summary: "size matches 128-bit memory accesses or 128-bit instruction execution."
    tags: ["norm:Sdtrig_mcontrol_size_128bit"]

  - name: Sdtrig_mcontrol_size_support
    summary: "Implementations must support size=0; all other values are optional."
    tags: ["norm:Sdtrig_mcontrol_size_support"]

  - name: Sdtrig_mcontrol_chain_disabled
    summary: "chain=0: the configured action is taken when this trigger matches."
    tags: ["norm:Sdtrig_mcontrol_chain_disabled"]

  - name: Sdtrig_mcontrol_chain_enabled
    summary: "chain=1: while not matching, prevents the next-index trigger from matching."
    tags: ["norm:Sdtrig_mcontrol_chain_enabled"]

  - name: Sdtrig_mcontrol_chain_start
    summary: "Chain spans triggers from chain=1 through next chain=0; final action used."
    tags: ["norm:Sdtrig_mcontrol_chain_start"]

  - name: Sdtrig_mcontrol_chain_next
    summary: "Hardware zeroes chain on dmode-0 writes if next trigger has dmode 1."
    tags: ["norm:Sdtrig_mcontrol_chain_next"]

  - name: Sdtrig_mcontrol_chain_ignore
    summary: "Hardware ignores dmode-1 writes if previous trigger has dmode 0, chain 1."
    tags: ["norm:Sdtrig_mcontrol_chain_ignore"]

  - name: Sdtrig_mcontrol_match_equal
    summary: "match=0: matches when any compare value equals tdata2."
    tags: ["norm:Sdtrig_mcontrol_match_equal"]

  - name: Sdtrig_mcontrol_match_napot
    summary: "match=1: matches top M bits via NAPOT encoding in tdata2."
    tags: ["norm:Sdtrig_mcontrol_match_napot"]

  - name: Sdtrig_mcontrol_match_ge
    summary: "match=2: matches when a compare value is ≥ tdata2 (unsigned)."
    tags: ["norm:Sdtrig_mcontrol_match_ge"]

  - name: Sdtrig_mcontrol_match_lt
    summary: "match=3: matches when a compare value is < tdata2 (unsigned)."
    tags: ["norm:Sdtrig_mcontrol_match_lt"]

  - name: Sdtrig_mcontrol_match_mask_low
    summary: "match=4: matches low half of compare value, masked by tdata2."
    tags: ["norm:Sdtrig_mcontrol_match_mask_low"]

  - name: Sdtrig_mcontrol_match_mask_high
    summary: "match=5: matches high half of compare value, masked by tdata2."
    tags: ["norm:Sdtrig_mcontrol_match_mask_high"]

  - name: Sdtrig_mcontrol_match_not_equal
    summary: "match=8: matches when match=0 would not match."
    tags: ["norm:Sdtrig_mcontrol_match_not_equal"]

  - name: Sdtrig_mcontrol_match_not_napot
    summary: "match=9: matches when match=1 would not match."
    tags: ["norm:Sdtrig_mcontrol_match_not_napot"]

  - name: Sdtrig_mcontrol_match_not_mask_low
    summary: "match=12: matches when match=4 would not match."
    tags: ["norm:Sdtrig_mcontrol_match_not_mask_low"]

  - name: Sdtrig_mcontrol_match_not_mask_high
    summary: "match=13: matches when match=5 would not match."
    tags: ["norm:Sdtrig_mcontrol_match_not_mask_high"]

  - name: Sdtrig_mcontrol_match_rsv
    summary: "Other match values are reserved for future use."
    tags: ["norm:Sdtrig_mcontrol_match_rsv"]

  - name: Sdtrig_mcontrol_comparisons
    summary: "Comparisons use lower XLEN bits, reduced to N when select=1."
    tags: ["norm:Sdtrig_mcontrol_comparisons"]

  - name: Sdtrig_mcontrol_m
    summary: "When set, enable this trigger in M-mode."
    tags: ["norm:Sdtrig_mcontrol_m"]

  - name: Sdtrig_mcontrol_s
    summary: "When set, enable in S/HS-mode; hard-wired 0 without S-mode."
    tags: ["norm:Sdtrig_mcontrol_s"]

  - name: Sdtrig_mcontrol_u
    summary: "When set, enable in U-mode; hard-wired 0 without U-mode."
    tags: ["norm:Sdtrig_mcontrol_u"]

  - name: Sdtrig_mcontrol_execute
    summary: "When set, fire on virtual address or opcode of executed instruction."
    tags: ["norm:Sdtrig_mcontrol_execute"]

  - name: Sdtrig_mcontrol_store
    summary: "When set, fire on virtual address or data of any store."
    tags: ["norm:Sdtrig_mcontrol_store"]

  - name: Sdtrig_mcontrol_load
    summary: "When set, fire on virtual address or data of any load."
    tags: ["norm:Sdtrig_mcontrol_load"]

  - name: Sdtrig_mcontrol6
