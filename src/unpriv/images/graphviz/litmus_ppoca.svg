<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <!-- Arrowheads -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="red"/>
    </marker>
    <marker id="arrow-darkgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="darkgreen"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="indigo"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ffa040"/>
    </marker>
  </defs>

  <style>
    .node text { font-family: sans-serif; font-size: 10px; fill: #000; text-anchor: middle; dominant-baseline: central; }
    .edge-label { font-family: sans-serif; font-size: 7px; font-weight: bold; }
  </style>

  <!-- NODES -->
  <!-- Left Column -->
  <g class="node" id="eiid0"><text x="60" y="25">a: Wx=1</text></g>
  <g class="node" id="eiid1"><text x="60" y="70">c: Wy=1</text></g>

  <!-- Right Column -->
  <g class="node" id="eiid2"><text x="210" y="25">d: Ry=1</text></g>
  <g class="node" id="eiid3"><text x="210" y="70">e: Wz=1</text></g>
  <g class="node" id="eiid4"><text x="210" y="115">f: Rz=1</text></g>
  <g class="node" id="eiid5"><text x="210" y="160">g: Rx=0</text></g>

  <!-- EDGES & LABELS -->

  <!-- eiid0 -> eiid1 (fence ppo) - Double-stemmed (darkgreen & indigo) -->
  <path d="M 58.5 32 L 58.5 62" stroke="darkgreen" stroke-width="1.5" fill="none" marker-end="url(#arrow-darkgreen)"/>
  <path d="M 61.5 32 L 61.5 62" stroke="indigo" stroke-width="1.5" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="52" y="47" text-anchor="end">
    <tspan fill="darkgreen">fence </tspan><tspan fill="indigo">ppo</tspan>
  </text>

  <!-- eiid1 -> eiid2 (rf) -->
  <path d="M 82 65 L 188 30" stroke="red" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>
  <text class="edge-label" x="135" y="42" text-anchor="middle" fill="red">rf</text>

  <!-- eiid2 -> eiid3 (ctrl ppo) -->
  <path d="M 210 32 L 210 62" stroke="indigo" stroke-width="1.8" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="216" y="47" text-anchor="start" fill="indigo">ctrl ppo</text>

  <!-- eiid2 -> eiid4 (ctrl) - Curved Outer Right -->
  <path d="M 228 30 C 265 55 265 85 228 110" stroke="indigo" stroke-width="1.8" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="256" y="70" text-anchor="start" fill="indigo">ctrl</text>

  <!-- eiid2 -> eiid5 (ctrl) - Far Outer Right Curve -->
  <path d="M 230 25 C 295 65 295 120 228 155" stroke="indigo" stroke-width="1.8" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="282" y="92.5" text-anchor="start" fill="indigo">ctrl</text>

  <!-- eiid3 -> eiid4 (rf) -->
  <path d="M 210 77 L 210 107" stroke="red" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>
  <text class="edge-label" x="204" y="92" text-anchor="end" fill="red">rf</text>

  <!-- eiid4 -> eiid5 (addr ppo) -->
  <path d="M 210 122 L 210 152" stroke="indigo" stroke-width="1.8" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="204" y="137" text-anchor="end" fill="indigo">addr ppo</text>

  <!-- eiid5 -> eiid0 (fr) - Connects to right side of a -->
  <path d="M 188 160 C 135 145 145 55 82 28" stroke="#ffa040" stroke-width="1.8" fill="none" marker-end="url(#arrow-orange)"/>
  <text class="edge-label" x="145" y="92.5" text-anchor="middle" fill="#ffa040">fr</text>
</svg>
