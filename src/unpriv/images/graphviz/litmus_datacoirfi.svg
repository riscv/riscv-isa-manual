<svg viewBox="0 0 585 564" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Litmus data+coi+rfi execution graph</title>
<desc id="desc">Seven-event execution graph chaining fence-ppo, reads-from, data-ppo, coherence-ppo, addr-ppo, and from-reads relations.</desc>
<style>
.event{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#000}
.label{font-family:Arial,Helvetica,sans-serif;font-size:27px}
.rel{fill:none;stroke-width:5px;stroke-linecap:butt;stroke-linejoin:miter}
</style>
<rect width="585" height="564" fill="#fff"/>
<!-- a -> c : fence + ppo -->
<path class="rel" d="M131 252V293" stroke="#4b0082"/>
<path class="rel" d="M137 252V293" stroke="#008000"/>
<polygon points="134,323 123,293 145,293" fill="#008000"/>
<!-- c -> d : rf -->
<path class="rel" d="M147 338L398.5 80.2" stroke="#f00"/>
<polygon points="418,60.2 406.4,87.9 390.6,72.5" fill="#f00"/>
<!-- d -> e : data + ppo -->
<path class="rel" d="M480 72V113" stroke="#4b0082"/>
<polygon points="480,143 469,113 491,113" fill="#4b0082"/>
<!-- e -> f : co + ppo -->
<path class="rel" d="M477 192V233" stroke="#00f"/>
<path class="rel" d="M483 192V233" stroke="#4b0082"/>
<polygon points="480,263 469,233 491,233" fill="#00f"/>
<!-- f -> g : rf -->
<path class="rel" d="M480 312V353" stroke="#f00"/>
<polygon points="480,383 469,353 491,353" fill="#f00"/>
<!-- g -> h : addr + ppo -->
<path class="rel" d="M480 432V473" stroke="#4b0082"/>
<polygon points="480,503 469,473 491,473" fill="#4b0082"/>
<!-- h -> a : fr -->
<path class="rel" d="M420 515L179.7 288.1" stroke="#ffa040"/>
<polygon points="159.3,268.9 187.2,280.1 172.2,296.1" fill="#ffa040"/>
<text class="event" x="80" y="235">a: W<tspan baseline-shift="sub" font-size="20">x</tspan><tspan font-size="28">=1</tspan></text>
<text class="event" x="77" y="355">c: W<tspan baseline-shift="sub" font-size="20">y</tspan><tspan font-size="28">=1</tspan></text>
<text class="event" x="425" y="55">d: R<tspan baseline-shift="sub" font-size="20">y</tspan><tspan font-size="28">=1</tspan></text>
<text class="event" x="425" y="175">e: W<tspan baseline-shift="sub" font-size="20">z</tspan><tspan font-size="28">=1</tspan></text>
<text class="event" x="425" y="295">f: W<tspan baseline-shift="sub" font-size="20">z</tspan><tspan font-size="28">=1</tspan></text>
<text class="event" x="425" y="415">g: R<tspan baseline-shift="sub" font-size="20">z</tspan><tspan font-size="28">=1</tspan></text>
<text class="event" x="425" y="535">h: R<tspan baseline-shift="sub" font-size="20">x</tspan><tspan font-size="28">=0</tspan></text>
<text class="label" x="6" y="283" fill="#008000">fence</text>
<text class="label" x="78" y="283" fill="#4b0082">ppo</text>
<text class="label" x="286" y="176" fill="#f00" text-anchor="middle">rf</text>
<text class="label" x="472" y="103" fill="#4b0082" text-anchor="end">data</text>
<text class="label" x="488" y="103" fill="#4b0082">ppo</text>
<text class="label" x="469" y="223" fill="#00f" text-anchor="end">co</text>
<text class="label" x="491" y="223" fill="#4b0082">ppo</text>
<text class="label" x="472" y="343" fill="#f00" text-anchor="end">rf</text>
<text class="label" x="472" y="463" fill="#4b0082" text-anchor="end">addr</text>
<text class="label" x="488" y="463" fill="#4b0082">ppo</text>
<text class="label" x="286" y="368" fill="#ffa040" text-anchor="middle">fr</text>
</svg>
