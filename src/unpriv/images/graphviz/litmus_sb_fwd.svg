<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 125" width="100%" height="100%">
  <defs>
    <!-- Arrowheads -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="red"/>
    </marker>
    <marker id="arrow-darkgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="darkgreen"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="indigo"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ffa040"/>
    </marker>
  </defs>

  <style>
    .node text { font-family: sans-serif; font-size: 9px; fill: #000; text-anchor: middle; dominant-baseline: central; }
    .edge-label { font-family: sans-serif; font-size: 8.5px; font-weight: bold; }
  </style>

  <!-- NODES -->
  <!-- Left Column -->
  <g class="node" id="eiid0"><text x="60" y="15">a: Wx=1</text></g>
  <g class="node" id="eiid1"><text x="60" y="52">b: Rx=1</text></g>
  <g class="node" id="eiid2"><text x="60" y="89">d: Ry=0</text></g>

  <!-- Right Column -->
  <g class="node" id="eiid3"><text x="220" y="15">e: Wy=1</text></g>
  <g class="node" id="eiid4"><text x="220" y="52">f: Ry=1</text></g>
  <g class="node" id="eiid5"><text x="220" y="89">h: Rx=0</text></g>

  <!-- EDGES & LABELS -->

  <!-- eiid0 -> eiid1 (rf) -->
  <path d="M 60 22 L 60 42" stroke="red" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>
  <text class="edge-label" x="53" y="32" text-anchor="end">
    <tspan fill="red">rf</tspan>
  </text>

  <!-- eiid1 -> eiid2 (fence ppo) - Double-stemmed (darkgreen & indigo) -->
  <path d="M 58.5 59 L 58.5 79" stroke="darkgreen" stroke-width="1.5" fill="none" marker-end="url(#arrow-darkgreen)"/>
  <path d="M 61.5 59 L 61.5 79" stroke="indigo" stroke-width="1.5" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="53" y="69" text-anchor="end">
    <tspan fill="darkgreen">fence </tspan><tspan fill="indigo">ppo</tspan>
  </text>

  <!-- eiid2 -> eiid3 (fr) -->
  <path d="M 80 84 L 200 20" stroke="#ffa040" stroke-width="1.8" fill="none" marker-end="url(#arrow-orange)"/>
  <text class="edge-label" x="140" y="55" text-anchor="middle">
    <tspan fill="#ffa040">fr</tspan>
  </text>

  <!-- eiid3 -> eiid4 (rf) -->
  <path d="M 220 22 L 220 42" stroke="red" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>
  <text class="edge-label" x="227" y="32" text-anchor="start">
    <tspan fill="red">rf</tspan>
  </text>

  <!-- eiid4 -> eiid5 (fence ppo) - Double-stemmed (darkgreen & indigo) -->
  <path d="M 218.5 59 L 218.5 79" stroke="darkgreen" stroke-width="1.5" fill="none" marker-end="url(#arrow-darkgreen)"/>
  <path d="M 221.5 59 L 221.5 79" stroke="indigo" stroke-width="1.5" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="227" y="69" text-anchor="start">
    <tspan fill="darkgreen">fence </tspan><tspan fill="indigo">ppo</tspan>
  </text>

  <!-- eiid5 -> eiid0 (fr) -->
  <path d="M 200 84 L 80 20" stroke="#ffa040" stroke-width="1.8" fill="none" marker-end="url(#arrow-orange)"/>
  <text class="edge-label" x="140" y="45" text-anchor="middle">
    <tspan fill="#ffa040">fr</tspan>
  </text>
</svg>
