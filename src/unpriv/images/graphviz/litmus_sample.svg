<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <!-- Arrowheads -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="blue"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="red"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ffa040"/>
    </marker>
  </defs>

  <style>
    .node text { font-family: sans-serif; font-size: 10px; fill: #000; text-anchor: middle; dominant-baseline: central; }
    .edge-label { font-family: sans-serif; font-size: 7px; font-weight: bold; }
  </style>

  <!-- NODES -->
  <g class="node" id="eiid0"><text x="110" y="25">a: Wx=1</text></g>
  <g class="node" id="eiid1"><text x="110" y="70">b: Wx=2</text></g>
  <g class="node" id="eiid2"><text x="110" y="115">c: Rx=1</text></g>
  <g class="node" id="eiid3"><text x="110" y="160">d: Wx=3</text></g>

  <g class="node" id="eiid4"><text x="240" y="65">e: Wx=4</text></g>
  <g class="node" id="eiid5"><text x="240" y="110">f: Wx=5</text></g>

  <!-- EDGES -->

  <!-- a -> b (co) -->
  <path d="M 105 32 C 100 42 100 53 105 63" stroke="blue" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <text class="edge-label" x="93" y="47" text-anchor="end" fill="blue">co</text>

  <!-- b -> a (co) -->
  <path d="M 115 63 C 120 53 120 42 115 32" stroke="blue" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <text class="edge-label" x="127" y="47" text-anchor="start" fill="blue">co</text>

  <!-- c -> b (fr) -->
  <path d="M 110 107 L 110 78" stroke="#ffa040" stroke-width="1.8" fill="none" marker-end="url(#arrow-orange)"/>
  <text class="edge-label" x="103" y="92" text-anchor="end" fill="#ffa040">fr</text>

  <!-- c -> d (fr) -->
  <path d="M 110 122 L 110 152" stroke="#ffa040" stroke-width="1.8" fill="none" marker-end="url(#arrow-orange)"/>
  <text class="edge-label" x="103" y="137" text-anchor="end" fill="#ffa040">fr</text>

  <!-- a -> c (rf) -->
  <path d="M 132 28 C 165 48 165 92 132 112" stroke="red" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>
  <text class="edge-label" x="160" y="70" text-anchor="start" fill="red">rf</text>

  <!-- c -> a (fr) -->
  <path d="M 88 112 C 55 92 55 48 88 28" stroke="#ffa040" stroke-width="1.8" fill="none" marker-end="url(#arrow-orange)"/>
  <text class="edge-label" x="60" y="70" text-anchor="end" fill="#ffa040">fr</text>

  <!-- b -> d (co) - Swapped to Right Side -->
  <path d="M 132 74 C 175 92 175 138 132 156" stroke="blue" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <text class="edge-label" x="172" y="115" text-anchor="start" fill="blue">co</text>

  <!-- e -> f (co) -->
  <path d="M 240 72 L 240 103" stroke="blue" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <text class="edge-label" x="246" y="87" text-anchor="start" fill="blue">co</text>
</svg>
