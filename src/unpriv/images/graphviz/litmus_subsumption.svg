<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 120" width="100%" height="100%">
  <defs>
    <!-- Arrowheads -->
    <marker id="arrow-darkgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="darkgreen"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="blue"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="red"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="indigo"/>
    </marker>
  </defs>

  <style>
    .node text { font-family: sans-serif; font-size: 9px; fill: #000; text-anchor: middle; dominant-baseline: central; }
    .edge-label { font-family: sans-serif; font-size: 8.5px; font-weight: bold; }
  </style>

  <!-- NODES -->
  <g class="node" id="eiid0"><text x="60" y="15">a: Wx=3</text></g>
  <g class="node" id="eiid1"><text x="60" y="55">b: Wy=1</text></g>
  <g class="node" id="eiid2"><text x="190" y="15">c: Ry=1</text></g>
  <g class="node" id="eiid3"><text x="190" y="55">d: Wx=1</text></g>
  <g class="node" id="eiid4"><text x="190" y="95">e: Wx=2</text></g>

  <!-- EDGES & LABELS -->

  <!-- eiid0 -> eiid1 (fence ppo) - Double-stemmed (darkgreen & indigo) -->
  <path d="M 58.5 23 L 58.5 45" stroke="darkgreen" stroke-width="1.5" fill="none" marker-end="url(#arrow-darkgreen)"/>
  <path d="M 61.5 23 L 61.5 45" stroke="indigo" stroke-width="1.5" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="53" y="34" text-anchor="end">
    <tspan fill="darkgreen">fence </tspan><tspan fill="indigo">ppo</tspan>
  </text>

  <!-- eiid0 -> eiid3 (co) -->
  <path d="M 82 19 L 168 49" stroke="blue" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <text class="edge-label" x="125" y="27" text-anchor="middle">
    <tspan fill="blue">co</tspan>
  </text>

  <!-- eiid1 -> eiid2 (rf) -->
  <path d="M 82 49 L 168 19" stroke="red" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>
  <text class="edge-label" x="125" y="43" text-anchor="middle">
    <tspan fill="red">rf</tspan>
  </text>

  <!-- eiid2 -> eiid3 (data ppo) -->
  <path d="M 190 23 L 190 45" stroke="indigo" stroke-width="1.8" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="196" y="34" text-anchor="start">
    <tspan fill="indigo">data ppo</tspan>
  </text>

  <!-- eiid3 -> eiid4 (co ppo) - Double-stemmed (blue & indigo) -->
  <path d="M 188.5 63 L 188.5 85" stroke="blue" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 191.5 63 L 191.5 85" stroke="indigo" stroke-width="1.5" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="196" y="74" text-anchor="start">
    <tspan fill="blue">co </tspan><tspan fill="indigo">ppo</tspan>
  </text>
</svg>
