<svg viewBox="0 0 638 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Litmus data+rfi execution graph</title>
<desc id="desc">Six-event execution graph with fence-ppo, reads-from, data-ppo, ppo, addr-ppo, and from-reads relations.</desc>
<style>
.event{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#000}
.label{font-family:Arial,Helvetica,sans-serif;font-size:27px}
.rel{fill:none;stroke-width:5px;stroke-linecap:butt;stroke-linejoin:miter}
</style>
<rect width="638" height="452" fill="#fff"/>
<!-- a -> c : fence + ppo -->
<path class="rel" d="M131 192V233" stroke="#4b0082"/>
<path class="rel" d="M137 192V233" stroke="#008000"/>
<polygon points="134,263 123,233 145,233" fill="#008000"/>
<!-- c -> d : rf -->
<path class="rel" d="M147 278L395.4 76.9" stroke="#f00"/>
<polygon points="417.2,59.3 402.3,85.5 388.5,68.3" fill="#f00"/>
<!-- d -> e : data + ppo -->
<path class="rel" d="M480 72V113" stroke="#4b0082"/>
<polygon points="480,143 469,113 491,113" fill="#4b0082"/>
<!-- d -> f : ppo (skip arc) -->
<path class="rel" d="M505 62C610 110,580 220,500 258" stroke="#4b0082"/>
<polygon points="500,258 520.6,236.1 530,255.9" fill="#4b0082"/>
<!-- e -> f : rf -->
<path class="rel" d="M480 192V233" stroke="#f00"/>
<polygon points="480,263 469,233 491,233" fill="#f00"/>
<!-- f -> g : addr + ppo -->
<path class="rel" d="M480 312V353" stroke="#4b0082"/>
<polygon points="480,383 469,353 491,353" fill="#4b0082"/>
<!-- g -> a : fr -->
<path class="rel" d="M420 397L180.4 217.8" stroke="#ffa040"/>
<polygon points="158,201 187,209 173.8,226.6" fill="#ffa040"/>
<text class="event" x="80" y="175">a: Wx=1</text>
<text class="event" x="77" y="295">c: Wy=1</text>
<text class="event" x="425" y="55">d: Ry=1</text>
<text class="event" x="425" y="175">e: Wz=1</text>
<text class="event" x="425" y="295">f: Rz=1</text>
<text class="event" x="425" y="415">g: Rx=0</text>
<text class="label" x="4" y="223" fill="#008000">fence</text>
<text class="label" x="79" y="223" fill="#4b0082">ppo</text>
<text class="label" x="286" y="146" fill="#f00" text-anchor="middle">rf</text>
<text class="label" x="472" y="103" fill="#4b0082" text-anchor="end">data</text>
<text class="label" x="488" y="103" fill="#4b0082">ppo</text>
<text class="label" x="565" y="103" fill="#4b0082">ppo</text>
<text class="label" x="487" y="223" fill="#f00">rf</text>
<text class="label" x="472" y="343" fill="#4b0082" text-anchor="end">addr</text>
<text class="label" x="488" y="343" fill="#4b0082">ppo</text>
<text class="label" x="286" y="277" fill="#ffa040" text-anchor="middle">fr</text>
</svg>
