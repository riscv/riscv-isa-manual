<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="100%">
  <defs>
    <!-- Arrowheads -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="red"/>
    </marker>
    <marker id="arrow-darkgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="darkgreen"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="indigo"/>
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="black"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ffa040"/>
    </marker>
  </defs>

  <style>
    .node text { font-family: sans-serif; font-size: 10px; fill: #000; text-anchor: middle; dominant-baseline: central; }
    .edge-label { font-family: sans-serif; font-size: 7px; font-weight: bold; }
  </style>

  <!-- NODES -->
  <!-- Column 1 (Left) -->
  <g class="node" id="eiid0"><text x="60" y="25">a: Wx=1</text></g>
  <g class="node" id="eiid1"><text x="60" y="70">c: Wy=1</text></g>

  <!-- Column 2 (Middle) -->
  <g class="node" id="eiid2"><text x="170" y="25">d: Ry=1</text></g>
  <g class="node" id="eiid3"><text x="170" y="70">g: Rz=v</text></g>
  <g class="node" id="eiid4"><text x="170" y="115">h: Rz=v</text></g>
  <g class="node" id="eiid5"><text x="170" y="160">k: Rx=0</text></g>

  <!-- Column 3 (Right) -->
  <g class="node" id="eiid6"><text x="280" y="92.5">Wz=v</text></g>

  <!-- EDGES & LABELS -->

  <!-- eiid0 -> eiid1 (fence ppo) - Double-stemmed (darkgreen & indigo) -->
  <path d="M 58.5 32 L 58.5 62" stroke="darkgreen" stroke-width="1.5" fill="none" marker-end="url(#arrow-darkgreen)"/>
  <path d="M 61.5 32 L 61.5 62" stroke="indigo" stroke-width="1.5" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="52" y="47" text-anchor="end">
    <tspan fill="darkgreen">fence </tspan><tspan fill="indigo">ppo</tspan>
  </text>

  <!-- eiid1 -> eiid2 (rf) -->
  <path d="M 82 61 L 148 34" stroke="red" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>
  <text class="edge-label" x="115" y="42" text-anchor="middle" fill="red">rf</text>

  <!-- eiid2 -> eiid3 (addr ppo) -->
  <path d="M 170 32 L 170 62" stroke="indigo" stroke-width="1.8" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="176" y="47" text-anchor="start" fill="indigo">addr ppo</text>

  <!-- eiid3 -> eiid4 (po) -->
  <path d="M 170 77 L 170 107" stroke="black" stroke-width="1.8" fill="none" marker-end="url(#arrow-black)"/>
  <text class="edge-label" x="176" y="92" text-anchor="start" fill="black">po</text>

  <!-- eiid4 -> eiid5 (addr ppo) -->
  <path d="M 170 122 L 170 152" stroke="indigo" stroke-width="1.8" fill="none" marker-end="url(#arrow-indigo)"/>
  <text class="edge-label" x="176" y="137" text-anchor="start" fill="indigo">addr ppo</text>

  <!-- eiid5 -> eiid0 (fr) - Crosses red line and connects to right side of a -->
  <path d="M 148 160 C 95 145 105 55 82 28" stroke="#ffa040" stroke-width="1.8" fill="none" marker-end="url(#arrow-orange)"/>
  <text class="edge-label" x="118" y="90" text-anchor="middle" fill="#ffa040">fr</text>

  <!-- eiid6 -> eiid3 (rf) -->
  <path d="M 258 88 L 192 73" stroke="red" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>
  <text class="edge-label" x="228" y="75" text-anchor="bottom" fill="red">rf</text>

  <!-- eiid6 -> eiid4 (rf) -->
  <path d="M 258 97 L 192 112" stroke="red" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>
  <text class="edge-label" x="228" y="112" text-anchor="top" fill="red">rf</text>
</svg>
