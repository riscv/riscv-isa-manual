<svg viewBox="0 0 578 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Litmus LB+lrsc execution graph</title>
<desc id="desc">A sample litmus test and one forbidden execution: six events with program-order, data-ppo, ppo, and reads-from relations.</desc>
<style>
.event{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#000}
.label{font-family:Arial,Helvetica,sans-serif;font-size:27px}
.rel{fill:none;stroke-width:5px;stroke-linecap:butt;stroke-linejoin:miter}
</style>
<rect width="578" height="448" fill="#fff"/>
<!-- a -> b : po -->
<path class="rel" d="M134 72V113" stroke="#000"/>
<polygon points="134,143 123,113 145,113" fill="#000"/>
<!-- a -> c : data + ppo (skip arc) -->
<path class="rel" d="M145 62C290 105,260 207,158 270" stroke="#4b0082"/>
<polygon points="158,270 177.7,244.9 189.3,263.6" fill="#4b0082"/>
<!-- b -> c : ppo -->
<path class="rel" d="M134 192V233" stroke="#4b0082"/>
<polygon points="134,263 123,233 145,233" fill="#4b0082"/>
<!-- c -> d : data + ppo -->
<path class="rel" d="M134 312V353" stroke="#4b0082"/>
<polygon points="134,383 123,353 145,353" fill="#4b0082"/>
<!-- d -> e : rf -->
<path class="rel" d="M147 398L381.1 82.6" stroke="#f00"/>
<polygon points="398.7,60.8 389.7,89.5 372.5,75.7" fill="#f00"/>
<!-- e -> f : data + ppo -->
<path class="rel" d="M460 72V113" stroke="#4b0082"/>
<polygon points="460,143 449,113 471,113" fill="#4b0082"/>
<!-- f -> a : rf -->
<path class="rel" d="M400 157L201 62" stroke="#f00"/>
<polygon points="176,50 206,52 197,72" fill="#f00"/>
<text class="event" x="80" y="55">a: R<tspan baseline-shift="sub" font-size="20">x</tspan><tspan font-size="28">=0</tspan></text>
<text class="event" x="75" y="175">b: R<tspan baseline-shift="sub" font-size="20">z</tspan><tspan font-size="28">*=0</tspan></text>
<text class="event" x="75" y="295">c: W<tspan baseline-shift="sub" font-size="20">z</tspan><tspan font-size="28">*=0</tspan></text>
<text class="event" x="77" y="415">d: W<tspan baseline-shift="sub" font-size="20">y</tspan><tspan font-size="28">=0</tspan></text>
<text class="event" x="405" y="55">e: R<tspan baseline-shift="sub" font-size="20">y</tspan><tspan font-size="28">=0</tspan></text>
<text class="event" x="405" y="175">f: W<tspan baseline-shift="sub" font-size="20">x</tspan><tspan font-size="28">=0</tspan></text>
<text class="label" x="126" y="103" text-anchor="end">po</text>
<text class="label" x="235" y="140" fill="#4b0082" text-anchor="end">data</text>
<text class="label" x="250" y="140" fill="#4b0082">ppo</text>
<text class="label" x="126" y="223" fill="#4b0082" text-anchor="end">ppo</text>
<text class="label" x="126" y="343" fill="#4b0082" text-anchor="end">data</text>
<text class="label" x="142" y="343" fill="#4b0082">ppo</text>
<text class="label" x="278" y="202" fill="#f00" text-anchor="middle">rf</text>
<text class="label" x="468" y="103" fill="#4b0082">data</text>
<text class="label" x="530" y="103" fill="#4b0082">ppo</text>
<text class="label" x="278" y="88" fill="#f00" text-anchor="middle">rf</text>
</svg>
