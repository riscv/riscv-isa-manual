<svg viewBox="0 0 589 333" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Litmus addrpo execution graph</title>
<desc id="desc">Six-event execution graph with program-order, reads-from, fence, address, and preserved-program-order relations.</desc>
<style>
.event{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#000}
.label{font-family:Arial,Helvetica,sans-serif;font-size:27px}
.rel{fill:none;stroke-width:5px;stroke-linecap:butt;stroke-linejoin:miter}
</style>
<rect width="589" height="333" fill="#fff"/>
<!-- relations; endpoints stop at the arrowhead bases -->
<path class="rel" d="M131 72V122" stroke="#4b0082"/>
<path class="rel" d="M137 72V122" stroke="#008000"/>
<polygon points="134,152 123,122 145,122" fill="#008000"/>
<path class="rel" d="M480 72V122" stroke="#4b0082"/>
<polygon points="480,153 469,122 491,122" fill="#4b0082"/>
<path class="rel" d="M480 201V253" stroke="#000"/>
<polygon points="480,283 469,253 491,253" fill="#000"/>
<path class="rel" d="M204 148L391 78" stroke="#f00"/>
<polygon points="420,66 391,67 397,85" fill="#f00"/>
<path class="rel" d="M443 276L187 84" stroke="#f00"/>
<polygon points="165,67 181,91 192,77" fill="#f00"/>
<path class="rel" d="M517 70C574 112 597 195 529 263" stroke="#4b0082"/>
<polygon points="511,282 535,263 523,252" fill="#4b0082"/>
<text class="event" x="80" y="55">a: R<tspan baseline-shift="sub" font-size="20">y</tspan><tspan font-size="28">=1</tspan></text>
<text class="event" x="77" y="184">c: W<tspan baseline-shift="sub" font-size="20">x</tspan><tspan font-size="28">=t</tspan></text>
<text class="event" x="425" y="55">d: R<tspan baseline-shift="sub" font-size="20">x</tspan><tspan font-size="28">=t</tspan></text>
<text class="event" x="425" y="184">e: R<tspan baseline-shift="sub" font-size="20">t</tspan><tspan font-size="28" font-family="Times New Roman, Times, serif" font-style="italic">=v</tspan></text>
<text class="event" x="424" y="313">f: W<tspan baseline-shift="sub" font-size="20">y</tspan><tspan font-size="28">=1</tspan></text>
<text class="label" x="4" y="112" fill="#008000">fence</text>
<text class="label" x="79" y="112" fill="#4b0082">ppo</text>
<text class="label" x="283" y="105" fill="#f00">rf</text>
<text class="label" x="283" y="146" fill="#f00">rf</text>
<text class="label" x="413" y="112" fill="#4b0082">addr</text>
<text class="label" x="483" y="112" fill="#4b0082">ppo</text>
<text class="label" x="440" y="239">po</text>
<text class="label" x="514" y="215" fill="#4b0082">ppo</text>
</svg>
