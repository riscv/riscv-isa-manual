---
# Column layout for the normative rules appendix generated by
# scripts/create_norm_rule_tables.py.
#
# Recognized "column" identifiers:
#   RULE_NAME - rule name, anchored as nr:<name> so other documents can deep-link
#               to the appendix row; annotated when it is an implementation-defined
#               behavior.
#   KIND      - ISA object kind and instance name(s) from the rule definition.
#   SUMMARY   - the rule's summary/description, when the definition supplies one.
#   CHAPTER   - the chapter the normative text lives in.
#   LOCATION  - links back into the specification: one entry per tag, each an
#               xref to the tagged text plus an xref to its enclosing section.
columns:
  - name: Normative Rule
    column: RULE_NAME
    width_pct: 22
  - name: Kind
    column: KIND
    width_pct: 13
  - name: Summary
    column: SUMMARY
    width_pct: 25
  - name: Location in Specification
    column: LOCATION
    width_pct: 40
